name: Release

# A pushed tag vX.Y.Z makes a draft GitHub Release (docs/releasing.md). Run by hand (workflow_dispatch), or on
# a pull request that changes this file, only `build` runs: a dry run whose assets are a workflow artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/release.yml']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Checks, builds and packages with a read-only token; nothing here can write to the repository.
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Third-party actions are pinned by commit SHA; the comment names the tag it resolved from.
      # Full history, to check that the tagged commit is on main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Version
        id: version
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          [ -n "$version" ] || { echo "no workspace version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME doesn't match version $version"; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME isn't on main"; exit 1; }
          fi

      # The CI checks, on the commit being released.
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
      - run: bash tools/check-licenses.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

      # No build machine paths in the exe (panic locations name source files): the workspace and the cargo
      # home are mapped to neutral prefixes, and the build fails if one is left.
      - name: Build
        shell: pwsh
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME '.cargo' }
          $env:RUSTFLAGS = "--remap-path-prefix=$cargoHome=cargo --remap-path-prefix=$env:GITHUB_WORKSPACE=busy"
          cargo build -p busy --release --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes('target\release\busy.exe'))
          if ($text.Contains($env:GITHUB_WORKSPACE) -or $text.Contains($cargoHome)) { throw 'a build path is left in busy.exe' }

      - name: Package
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory dist, pkg | Out-Null
          Copy-Item target\release\busy.exe dist\
          Copy-Item target\release\busy.exe, LICENSE, README.md, THIRD-PARTY-LICENSES.txt pkg\
          Compress-Archive -Path pkg\* -DestinationPath "dist\busy-$v-x64.zip"
          $files = Get-ChildItem dist -File | Sort-Object Name
          $sums = $files | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          Set-Content -Path dist\SHA256SUMS -Value $sums -Encoding ascii
          Get-Content dist\SHA256SUMS

      # The version's section of CHANGELOG.md, without its heading; a release needs one.
      - name: Notes
        shell: bash
        run: |
          v='${{ steps.version.outputs.version }}'
          awk -v h="## [$v]" 'index($0, h) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > dist/notes.md
          if [ "$GITHUB_REF_TYPE" = tag ] && ! grep -q '[^[:space:]]' dist/notes.md; then
            echo "CHANGELOG.md has no section for $v"; exit 1
          fi
          cat dist/notes.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  # Only for a tag: attests what `build` made and drafts the Release. The only job with a write token.
  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the draft Release
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/busy.exe
            dist/busy-*.zip
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mv dist/notes.md notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "busy $VERSION" --notes-file notes.md
