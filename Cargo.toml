[workspace]
resolver = "3"
members = ["crates/core", "crates/win", "crates/metrics", "crates/sensors", "crates/settings", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/aivanyuk/busy"

[workspace.dependencies]
busy-core = { path = "crates/core" }
busy-metrics = { path = "crates/metrics" }
busy-sensors = { path = "crates/sensors" }
busy-settings = { path = "crates/settings" }
busy-win = { path = "crates/win" }
windows = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
